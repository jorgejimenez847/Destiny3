{% extends "base.html" %}
{% block title %}Confirmar eliminación{% endblock %}
{% block content %}<section class="max-w-xl mx-auto rounded-2xl border border-zinc-800 bg-zinc-900 p-8"><h1 class="text-2xl font-bold">Eliminar registro</h1><p class="mt-4 text-zinc-300">{{ perfil }} · {{ objeto }}</p><p class="mt-3 text-zinc-400">Esta acción modificará los horarios disponibles. Confirma para continuar.</p><form method="post" class="flex gap-4 mt-6">{% csrf_token %}<button class="rounded-lg bg-amber-500 px-4 py-2 text-zinc-950 font-semibold">Confirmar eliminación</button><a class="rounded-lg border border-zinc-700 px-4 py-2" href="{% url 'barberos:detalle' perfil.pk %}">Cancelar</a></form></section>{% endblock %}
