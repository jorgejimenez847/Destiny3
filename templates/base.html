{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Barbería{% endblock %}</title>
  {% tailwind_css %}
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col">
  <header class="border-b border-zinc-800">
    <nav class="max-w-6xl mx-auto flex items-center justify-between px-4 py-4">
      <a href="{% url 'home' %}" class="text-xl font-bold tracking-wide">✂️ Barbería</a>
    </nav>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-zinc-800 py-4 text-center text-xs text-zinc-500">
    Sistema de reservas · Desarrollo de Software VIII
  </footer>
</body>
</html>
