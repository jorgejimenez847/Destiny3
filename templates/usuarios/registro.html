{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<div class="max-w-md mx-auto rounded-2xl border border-zinc-800 bg-zinc-900 p-8">
  <h1 class="text-2xl font-bold mb-6">Crear cuenta</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% include "includes/campos_form.html" %}
    <button type="submit" class="w-full rounded-lg bg-amber-500 py-2 font-semibold text-zinc-950 hover:bg-amber-400">
      Registrarme
    </button>
  </form>
  <p class="mt-4 text-sm text-zinc-400">
    ¿Ya tienes cuenta?
    <a href="{% url 'usuarios:login' %}" class="text-amber-400 hover:underline">Inicia sesión</a>
  </p>
</div>
{% endblock %}
