{% extends "base.html" %}
{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<div class="max-w-md mx-auto rounded-2xl border border-zinc-800 bg-zinc-900 p-8">
  <h1 class="text-2xl font-bold mb-2">Recuperar contraseña</h1>
  <p class="text-sm text-zinc-400 mb-6">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% include "includes/campos_form.html" %}
    <button type="submit" class="w-full rounded-lg bg-amber-500 py-2 font-semibold text-zinc-950 hover:bg-amber-400">
      Enviar enlace
    </button>
  </form>
</div>
{% endblock %}
