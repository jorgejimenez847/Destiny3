{% extends "base.html" %}
{% block title %}Correo enviado{% endblock %}
{% block content %}
<div class="max-w-md mx-auto rounded-2xl border border-zinc-800 bg-zinc-900 p-8">
  <h1 class="text-2xl font-bold mb-2">Revisa tu correo</h1>

  <a href="{% url 'usuarios:login' %}" class="mt-6 inline-block text-amber-400 hover:underline">Volver a iniciar sesión</a>
</div>
{% endblock %}
