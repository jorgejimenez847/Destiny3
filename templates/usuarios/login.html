{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="max-w-md mx-auto rounded-2xl border border-zinc-800 bg-zinc-900 p-8">
  <h1 class="text-2xl font-bold mb-6">Iniciar sesión</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% include "includes/campos_form.html" %}
    <button type="submit" class="w-full rounded-lg bg-amber-500 py-2 font-semibold text-zinc-950 hover:bg-amber-400">
      Entrar
    </button>
  </form>
  <div class="mt-4 flex justify-between text-sm text-zinc-400">
    <a href="{% url 'usuarios:registro' %}" class="hover:text-amber-400">Crear cuenta</a>
    <a href="{% url 'usuarios:password_reset' %}" class="hover:text-amber-400">¿Olvidaste tu contraseña?</a>
  </div>
</div>
{% endblock %}
