{% extends "base.html" %}
{% block title %}Panel administrativo{% endblock %}
{% block content %}
<div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-8">
  <p class="text-xs uppercase tracking-wide text-amber-400">Rol: Administrador</p>
  <h1 class="mt-1 text-3xl font-bold">Hola, {{ user.first_name|default:user.username }}</h1>
  <p class="mt-2 text-zinc-400">Aquí administrarás usuarios, servicios, barberos y reportes.</p>
  <a href="/admin/" class="mt-6 inline-block rounded-lg bg-amber-500 px-4 py-2 font-semibold text-zinc-950 hover:bg-amber-400">
    Ir al administrador de Django
  </a>
</div>
{% endblock %}
