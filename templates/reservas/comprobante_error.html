{% extends "base.html" %}
{% block title %}Comprobante no disponible{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl rounded-2xl border border-zinc-800 bg-zinc-900 p-6 md:p-8">
  <h1 class="text-2xl font-bold">No pudimos generar el comprobante</h1>
  <p role="alert" class="mt-3 text-zinc-300">Tu reserva y tu pago siguen confirmados. Intenta descargarlo nuevamente en unos minutos.</p>
  <a class="mt-6 inline-block text-amber-400 underline" href="{% url 'reservas:detalle' cita.pk %}">Volver a mi reserva</a>
</section>
{% endblock %}
