services:
  db:
    image: postgres:16
    container_name: barberia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Configura DB_NAME en .env}
      POSTGRES_USER: ${DB_USER:?Configura DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
